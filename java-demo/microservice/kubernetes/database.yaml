apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  labels:
    appType: database
spec:
  replicas: 1
  selector:
    matchLabels:
      appType: database
  template:
    metadata:
      labels:
        appType: database
    spec:
      containers:
      - name: database
        image: swr.cn-north-4.myhuaweicloud.com/rg/traveldog_database:latest
        ports:
        - containerPort: 3306
    
---

apiVersion: v1
kind: Service
metadata:
  name: database
  labels:
    appType: database
spec:
  type: NodePort  # for test.
  ports:
  - port: 3306
    nodePort: 30306 # for test.
    targetPort: 3306
    protocol: TCP
  selector:
    appType: database
